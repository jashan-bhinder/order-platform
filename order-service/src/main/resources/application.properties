spring.application.name=order-service

# Local development database; override credentials and URL through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Convenient for this mock service; use schema migrations for a production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
# Consumers own their event classes, so do not send this service's Java class name.
spring.kafka.producer.properties[spring.json.add.type.headers]=false
